org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Keep classic android {} DSL for Flutter plugins that are not yet on AGP 9 newDsl.
android.newDsl=false
# Avoid Kotlin incremental cache crash when pub-cache (C:) and project (D:) differ
kotlin.incremental=false
kotlin.incremental.android=false
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000
# Flutter migrator disables AGP built-in Kotlin for existing apps; keep KGP plugin applied.
android.builtInKotlin=false
